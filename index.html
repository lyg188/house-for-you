<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>房找人 - 你参与创造的理想家</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif; }
    .entry-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a365d 0%, #2d5a8e 50%, #1a365d 100%);
      gap: 24px;
    }
    .entry-card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      width: 320px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    }
    .entry-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .entry-icon { font-size: 48px; margin-bottom: 16px; }
    .entry-title { font-size: 24px; font-weight: 700; color: #1a365d; margin-bottom: 8px; }
    .entry-desc { font-size: 14px; color: #718096; }
    .brand-title { color: white; font-size: 32px; font-weight: 800; text-align: center; }
    .brand-subtitle { color: rgba(255,255,255,0.7); font-size: 16px; text-align: center; margin-top: 4px; }
    .cards-row { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <div class="entry-container">
    <div>
      <div class="brand-title">🏠 房找人</div>
      <div class="brand-subtitle">你参与创造的理想家</div>
    </div>
    <div class="cards-row">
      <div class="entry-card" onclick="location.href='/app/index.html'">
        <div class="entry-icon">📱</div>
        <div class="entry-title">客户端 APP</div>
        <div class="entry-desc">需求表达 · 共创设计 · 投资管理 · 评价反馈</div>
      </div>
      <div class="entry-card" onclick="location.href='/admin/index.html'">
        <div class="entry-icon">💻</div>
        <div class="entry-title">管理后台</div>
        <div class="entry-desc">项目仪表盘 · 需求洞察 · LP管理 · 评价分析</div>
      </div>
    </div>
  </div>
</body>
</html>
